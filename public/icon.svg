<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer Ring Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="12 12" opacity="0.6" />
  
  <!-- Glow under the core -->
  <circle cx="256" cy="240" r="80" fill="url(#glow)" opacity="0.25" filter="url(#blurGlow)" />

  <!-- Antigravity Levitation Symbol (Upward Vector & Crystalline Nodes) -->
  <g transform="translate(256, 256)">
    <!-- Levitation Rings -->
    <ellipse cx="0" cy="110" rx="90" ry="24" fill="none" stroke="url(#primary)" stroke-width="6" opacity="0.8" />
    <ellipse cx="0" cy="135" rx="60" ry="16" fill="none" stroke="url(#primary)" stroke-width="4" opacity="0.4" />
    
    <!-- Floating Hexagonal Core -->
    <polygon points="0,-130 95,-75 95,35 0,90 -95,35 -95,-75" fill="#090d16" stroke="url(#primary)" stroke-width="12" />
    
    <!-- Inner Prompt Compiler Diamond & Arrow -->
    <polygon points="0,-90 60,-50 60,20 0,60 -60,20 -60,-50" fill="url(#primary)" opacity="0.2" />
    
    <!-- Futuristic Upward Propulsion Glyph -->
    <path d="M 0 -70 L 45 10 L 15 10 L 15 50 L -15 50 L -15 10 L -45 10 Z" fill="url(#glow)" filter="url(#blurGlow)" />
    <path d="M 0 -70 L 45 10 L 15 10 L 15 50 L -15 50 L -15 10 L -45 10 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Code Brackets @ Orbit -->
    <text x="-12" y="-14" fill="#a5b4fc" font-family="monospace" font-size="28" font-weight="900">@</text>
  </g>
</svg>
